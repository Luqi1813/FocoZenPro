name: Create Trello Card on Changelog Update

on:
  push:
    branches:
      - main
    paths:
      - 'CHANGELOG.md'

jobs:
  create-trello-card:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3

      - name: Extract latest version from CHANGELOG
        id: version
        run: |
          VERSION=$(head -20 CHANGELOG.md | grep "## \[" | head -1 | sed 's/## \[\(.*\)\].*/\1/')
          echo "version=$VERSION" >> $GITHUB_OUTPUT

      - name: Extract changelog for latest version
        id: changelog
        run: |
          VERSION="${{ steps.version.outputs.version }}"
          
          # Extract changelog section for this version
          CHANGELOG=$(awk "/## \[$VERSION\]/,/## \[/" CHANGELOG.md | sed '$d')
          
          # Remove the version header line
          CHANGELOG=$(echo "$CHANGELOG" | sed '1d')
          
          # Save to file for curl to read
          echo "$CHANGELOG" > /tmp/changelog.txt
          
          echo "content=@/tmp/changelog.txt" >> $GITHUB_OUTPUT

      - name: Create Trello Card in "Ready for Release" List
        env:
          TRELLO_API_KEY: ${{ secrets.TRELLO_API_KEY }}
          TRELLO_TOKEN: ${{ secrets.TRELLO_TOKEN }}
          TRELLO_READY_LIST_ID: ${{ secrets.TRELLO_READY_LIST_ID }}
        run: |
          echo "Creating card for version: ${{ steps.version.outputs.version }}"
          
          # Read changelog from file
          CHANGELOG_CONTENT=$(cat /tmp/changelog.txt)
          
          # URL encode the description
          ENCODED_DESC=$(echo "$CHANGELOG_CONTENT" | jq -sRr @uri)
          
          RESPONSE=$(curl -s -X POST "https://api.trello.com/1/cards" \
            --data-urlencode "key=$TRELLO_API_KEY" \
            --data-urlencode "token=$TRELLO_TOKEN" \
            --data-urlencode "idList=$TRELLO_READY_LIST_ID" \
            --data-urlencode "name=📝 Mudanças v${{ steps.version.outputs.version }} prontas" \
            --data-urlencode "desc=$CHANGELOG_CONTENT" \
            -d "pos=top")
          
          echo "Response: $RESPONSE"
          
          if echo "$RESPONSE" | grep -q "id"; then
            echo "✅ Card created successfully!"
          else
            echo "❌ Failed to create card"
            exit 1
          fi
