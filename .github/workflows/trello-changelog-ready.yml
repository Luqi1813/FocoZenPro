name: Create Trello Card on Changelog Update

on:
  push:
    branches:
      - main
    paths:
      - 'CHANGELOG.md'

jobs:
  create-trello-card:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3

      - name: Debug and Extract Changelog
        id: extract
        run: |
          echo "=== CONTEÚDO DO CHANGELOG.MD ==="
          head -30 CHANGELOG.md
          
          echo ""
          echo "=== EXTRAINDO VERSÃO ==="
          VERSION=$(grep "^## \[" CHANGELOG.md | head -1 | sed 's/## \[\([^]]*\)\].*/\1/')
          echo "Versão encontrada: [$VERSION]"
          
          echo ""
          echo "=== EXTRAINDO CHANGELOG DA VERSÃO ==="
          SECTION=$(awk "BEGIN{found=0} /^## \[$VERSION\]/{found=1; next} found && /^## \[/{exit} found{print}" CHANGELOG.md)
          echo "Conteúdo extraído:"
          echo "$SECTION"
          echo "=== FIM DO CONTEÚDO ==="
          
          echo ""
          echo "=== VERIFICANDO SE CONTEÚDO ESTÁ VAZIO ==="
          if [ -z "$SECTION" ]; then
            echo "❌ CONTEÚDO VAZIO! O awk não extraiu nada."
          else
            LINE_COUNT=$(echo "$SECTION" | wc -l)
            echo "✅ Conteúdo extraído com $LINE_COUNT linhas"
          fi
          
          # Save to file
          printf '%s' "$SECTION" > /tmp/changelog.txt
          
          echo "version=$VERSION" >> $GITHUB_OUTPUT

      - name: Create Trello Card
        env:
          TRELLO_API_KEY: ${{ secrets.TRELLO_API_KEY }}
          TRELLO_TOKEN: ${{ secrets.TRELLO_TOKEN }}
          TRELLO_READY_LIST_ID: ${{ secrets.TRELLO_READY_LIST_ID }}
        run: |
          VERSION="${{ steps.extract.outputs.version }}"
          CHANGELOG_CONTENT=$(cat /tmp/changelog.txt)
          
          echo "=== VERSÃO: $VERSION ==="
          echo "=== LISTA ID: $TRELLO_READY_LIST_ID ==="
          echo "=== CHANGELOG: ==="
          echo "$CHANGELOG_CONTENT"
          echo "=== FIM ==="
          
          # Build JSON safely with jq
          JSON_PAYLOAD=$(jq -n \
            --arg key "$TRELLO_API_KEY" \
            --arg token "$TRELLO_TOKEN" \
            --arg idList "$TRELLO_READY_LIST_ID" \
            --arg name "📝 Mudanças v${VERSION} prontas" \
            --arg desc "$CHANGELOG_CONTENT" \
            '{key: $key, token: $token, idList: $idList, name: $name, desc: $desc, pos: "top"}')
          
          echo "=== JSON GERADO (sem secrets) ==="
          echo "$JSON_PAYLOAD" | jq 'del(.key, .token)'
          
          RESPONSE=$(curl -s -X POST "https://api.trello.com/1/cards" \
            -H "Content-Type: application/json" \
            -d "$JSON_PAYLOAD")
          
          echo "=== RESPOSTA DA API TRELLO ==="
          echo "$RESPONSE" | jq '{id, name, desc, shortUrl}' 2>/dev/null || echo "$RESPONSE"
          
          if echo "$RESPONSE" | grep -q '"id"'; then
            echo "✅ Card criado com sucesso!"
          else
            echo "❌ Falha ao criar card"
            exit 1
          fi
